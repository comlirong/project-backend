<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Open MOD · 后端网站</title>
  <style>
    /* 全局优雅重置与现代化风格 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    /* 玻璃态卡片容器，让大标题聚焦 */
    .hero-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      padding: 4.5rem 5.5rem;
      text-align: center;
      transition: all 0.25s ease;
      max-width: 90vw;
    }

    /* 大标题核心样式 — 极简但辨识度 */
    .main-heading {
      font-size: clamp(2.8rem, 12vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #f8fafc;
      text-shadow: 0 8px 20px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.03);
      word-break: break-word;
      transition: transform 0.2s ease;
      cursor: default;
      font-family: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 装饰性微光 —— 让标题更有质感 */
    .main-heading span {
      background: linear-gradient(120deg, #e6edf3 20%, #bdd3e8 60%, #d9e6f2 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      padding: 0 0.1em;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
    }

    /* 语言切换标记（低调但可见，满足多语言需求） */
    .lang-hint {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .lang-hint span {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      color: #e2e8f0;
      transition: 0.2s;
    }

    .lang-hint span:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* 极简响应式调整 */
    @media (max-width: 600px) {
      .hero-card {
        padding: 3rem 2rem;
        border-radius: 2.5rem;
      }
      .lang-hint {
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- 核心结构：唯一大标题 + 多语言支持 -->
  <div class="hero-card">
    <!-- data-i18n 用于动态多语言填充，span 为装饰渐变 -->
    <h1 class="main-heading" id="mainTitle" data-i18n="title">
      <span>欢迎访问Open MOD后端网站</span>
    </h1>
    
    <!-- 语言提示（视觉显示支持的语言） -->
    <div class="lang-hint" aria-hidden="true">
      <span>中文</span>
      <span>EN</span>
      <span>日本語</span>
      <span>한국어</span>
      <span>Español</span>
      <span>Français</span>
    </div>
  </div>

  <script>
    (function() {
      // 多语言字典 —— 覆盖常见浏览器语言代码
      const translations = {
        // 中文 (简体/繁体通用显示)
        'zh': '欢迎访问Open MOD后端网站',
        'zh-CN': '欢迎访问Open MOD后端网站',
        'zh-TW': '歡迎訪問Open MOD後端網站',
        'zh-HK': '歡迎訪問Open MOD後端網站',
        
        // 英语 (及各种英语变体)
        'en': 'Welcome to the Open MOD Backend Website',
        'en-US': 'Welcome to the Open MOD Backend Website',
        'en-GB': 'Welcome to the Open MOD Backend Website',
        'en-AU': 'Welcome to the Open MOD Backend Website',
        'en-CA': 'Welcome to the Open MOD Backend Website',
        
        // 日语
        'ja': 'Open MODバックエンドサイトへようこそ',
        'ja-JP': 'Open MODバックエンドサイトへようこそ',
        
        // 韩语
        'ko': 'Open MOD 백엔드 웹사이트에 오신 것을 환영합니다',
        'ko-KR': 'Open MOD 백엔드 웹사이트에 오신 것을 환영합니다',
        
        // 西班牙语
        'es': 'Bienvenido al sitio web backend de Open MOD',
        'es-ES': 'Bienvenido al sitio web backend de Open MOD',
        'es-MX': 'Bienvenido al sitio web backend de Open MOD',
        'es-AR': 'Bienvenido al sitio web backend de Open MOD',
        
        // 法语
        'fr': 'Bienvenue sur le site backend Open MOD',
        'fr-FR': 'Bienvenue sur le site backend Open MOD',
        'fr-CA': 'Bienvenue sur le site backend Open MOD',
        
        // 德语
        'de': 'Willkommen auf der Open MOD Backend-Website',
        'de-DE': 'Willkommen auf der Open MOD Backend-Website',
        
        // 葡萄牙语 (巴西/欧洲)
        'pt': 'Bem-vindo ao site backend do Open MOD',
        'pt-BR': 'Bem-vindo ao site backend do Open MOD',
        'pt-PT': 'Bem-vindo ao site backend do Open MOD',
        
        // 俄语
        'ru': 'Добро пожаловать на серверный сайт Open MOD',
        'ru-RU': 'Добро пожаловать на серверный сайт Open MOD',
        
        // 意大利语
        'it': 'Benvenuto nel sito backend di Open MOD',
        'it-IT': 'Benvenuto nel sito backend di Open MOD',
        
        // 阿拉伯语 (通用)
        'ar': 'مرحباً بكم في موقع Open MOD الخلفي',
        'ar-SA': 'مرحباً بكم في موقع Open MOD الخلفي',
        
        // 荷兰语
        'nl': 'Welkom op de Open MOD backend website',
        'nl-NL': 'Welkom op de Open MOD backend website',
        
        // 波兰语
        'pl': 'Witamy na stronie backendowej Open MOD',
        'pl-PL': 'Witamy na stronie backendowej Open MOD',
        
        // 土耳其语
        'tr': 'Open MOD arka uç web sitesine hoş geldiniz',
        'tr-TR': 'Open MOD arka uç web sitesine hoş geldiniz',
        
        // 越南语
        'vi': 'Chào mừng đến với trang web backend Open MOD',
        'vi-VN': 'Chào mừng đến với trang web backend Open MOD',
        
        // 印尼语
        'id': 'Selamat datang di situs backend Open MOD',
        'id-ID': 'Selamat datang di situs backend Open MOD',
        
        // 泰语
        'th': 'ยินดีต้อนรับสู่เว็บไซต์แบ็กเอนด์ Open MOD',
        'th-TH': 'ยินดีต้อนรับสู่เว็บไซต์แบ็กเอนด์ Open MOD',
        
        // 瑞典语
        'sv': 'Välkommen till Open MOD backend-webbplats',
        'sv-SE': 'Välkommen till Open MOD backend-webbplats',
        
        // 挪威语
        'nb': 'Velkommen til Open MOD backend-nettsted',
        'no': 'Velkommen til Open MOD backend-nettsted',
        
        // 丹麦语
        'da': 'Velkommen til Open MOD backend-webstedet',
        'da-DK': 'Velkommen til Open MOD backend-webstedet',
        
        // 芬兰语
        'fi': 'Tervetuloa Open MOD -taustajärjestelmäsivustolle',
        'fi-FI': 'Tervetuloa Open MOD -taustajärjestelmäsivustolle',
        
        // 希腊语
        'el': 'Καλώς ήρθατε στον ιστότοπο backend του Open MOD',
        'el-GR': 'Καλώς ήρθατε στον ιστότοπο backend του Open MOD',
        
        // 捷克语
        'cs': 'Vítejte na backendovém webu Open MOD',
        'cs-CZ': 'Vítejte na backendovém webu Open MOD',
        
        // 匈牙利语
        'hu': 'Üdvözöljük az Open MOD háttérrendszer weboldalán',
        'hu-HU': 'Üdvözöljük az Open MOD háttérrendszer weboldalán',
        
        // 罗马尼亚语
        'ro': 'Bine ați venit pe site-ul backend Open MOD',
        'ro-RO': 'Bine ați venit pe site-ul backend Open MOD',
      };

      // 获取当前浏览器语言 (优先 navigator.languages，或降级)
      function getBrowserLanguage() {
        if (navigator.languages && navigator.languages.length) {
          // 按顺序检测，找到第一个匹配的翻译
          for (let lang of navigator.languages) {
            const normalizedLang = lang.trim();
            // 精确匹配
            if (translations[normalizedLang]) {
              return normalizedLang;
            }
            // 尝试匹配主语言 (例如 'zh-Hans' 回退到 'zh')
            const baseLang = normalizedLang.split('-')[0];
            if (translations[baseLang]) {
              return baseLang;
            }
          }
        }
        // 回退到 navigator.language
        const navLang = (navigator.language || navigator.userLanguage || 'en').trim();
        if (translations[navLang]) return navLang;
        const baseLang = navLang.split('-')[0];
        if (translations[baseLang]) return baseLang;
        return 'en'; // 默认英文
      }

      // 应用翻译到标题元素 (同时保留渐变span结构)
      function applyTranslation() {
        const langKey = getBrowserLanguage();
        const translatedText = translations[langKey] || translations['en'] || '欢迎访问Open MOD后端网站';
        
        const titleElement = document.getElementById('mainTitle');
        if (!titleElement) return;
        
        // 清空并重新创建span以保持渐变效果
        titleElement.innerHTML = '';
        const span = document.createElement('span');
        span.textContent = translatedText;
        titleElement.appendChild(span);
        
        // 同时更新data-i18n用于调试或后续扩展
        titleElement.setAttribute('data-i18n', langKey);
        
        // 同步更新html lang属性，提升可访问性
        document.documentElement.lang = langKey;
      }

      // 初始化加载
      applyTranslation();

      // 监听语言变化（某些浏览器或用户调整时，但一般不会自动触发，保留兼容性）
      window.addEventListener('languagechange', applyTranslation);
    })();
  </script>
</body>
</html>
